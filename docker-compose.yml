services:
  feishu-contract-chat-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: feishu-contract-chat-bot:latest
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "4302"
      DATA_DIR: /app/data
    ports:
      - "${HOST_PORT:-4302}:4302"
    volumes:
      - bot_data:/app/data
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4302/healthz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  bot_data:
